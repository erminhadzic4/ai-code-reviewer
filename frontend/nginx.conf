# Serves the built frontend and passes /api to the backend, so the browser talks to one
# origin and no CORS configuration is needed.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Docker's own DNS server. The backend's address is looked up per request, not once at
    # startup, so nginx starts without the backend and follows it when it is recreated.
    resolver 127.0.0.11 valid=10s;

    location /api/ {
        # With a variable and no path, the request URI is passed on unchanged (/api/...).
        set $backend http://backend:8080;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Built JavaScript and CSS have a hash of their content in the name, so a changed file
    # gets a new name and the old one can be cached for good. A missing file is a 404,
    # never the page.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Everything else: a file if it exists, otherwise the page itself, so that an address
    # such as /reviews/<id> opened directly or reloaded is handled by the router. Checked
    # with the server on every load, so a new build is picked up at once.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
