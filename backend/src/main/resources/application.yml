spring:
  application:
    name: backend
  config:
    # Reads the repository's .env when the backend runs on the host; absent in CI and containers.
    import: "optional:file:../.env[.properties]"
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB:codereviewer}
    username: ${POSTGRES_USER:codereviewer}
    password: ${POSTGRES_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

app:
  jwt:
    # No default on purpose: the application refuses to start without a strong secret.
    secret: ${JWT_SECRET:}
    expiration: 24h
  github:
    # Optional: without a token GitHub allows 60 API requests an hour, with one 5000.
    token: ${GITHUB_TOKEN:}
    api-url: https://api.github.com
    archive-url: https://codeload.github.com
    connect-timeout: 5s
    read-timeout: 30s
    download-timeout: 60s
    # Coarse guard only: GitHub's number covers the whole history and is refreshed now and
    # then (a new repository reports 0). The limits below are the real ones.
    max-repo-size: 1GB
    max-download-size: 50MB
    max-uncompressed-size: 200MB
    max-entries: 20000
    max-file-size: 200KB
    max-files: 500
    max-source-size: 2MB
  gemini:
    # Needed only when the provider is "gemini". Use a key of a Google project without
    # billing: on the free tier a call costs nothing, with billing every call is charged.
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-3.5-flash-lite}
    api-url: https://generativelanguage.googleapis.com
    connect-timeout: 5s
    read-timeout: 120s
    # The longest answer the validator accepts stays below this.
    max-output-tokens: 32768
    max-response-size: 2MB
    # How fast the job sends requests, kept below the free limits of the model (15 requests
    # and 250 thousand tokens a minute). 600 thousand characters are three full chunks, about
    # 214 thousand tokens at 2.8 characters per token.
    requests-per-minute: 12
    characters-per-minute: 600000
  review:
    # "fake" returns fixed findings and needs no API key.
    provider: ${REVIEW_PROVIDER:fake}
    # Characters of source per request, line numbers included. A full chunk of Java measured
    # about 71 thousand tokens (2.8 characters per token); it has to fit the provider's
    # tokens-per-minute limit.
    chunk-budget: 200000
    # A review that fails for a reason that can pass (a rate limit, a server error) is tried
    # again later. Every attempt repeats the whole review and spends the model's quota again.
    max-attempts: 3

management:
  endpoints:
    web:
      exposure:
        include: health
